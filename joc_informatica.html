 try{

 for(var i=0;i<f.length;i++){
  var ic=(f[i][0]==='W')?'<span class="arxiu-w">W</span>':'<span class="e">'+f[i][0]+'</span>';
  var ok=f[i][2]===null?1:0;
  h+='<span class="ptu" '+(ok?'data-ok="1" id="fx-w"':'data-wrong="'+f[i][2]+'"')+'>'+ic+f[i][1]+'</span>';
 }
 return '<div class="pant gris"><div class="exp">'
  +'<div class="tit-fin2">📁 Documents</div>'
  +'<div class="exp-cap">'+ruta(['Aquest PC','Documents'],null)+'</div>'
  +'<div class="exp-corp">'+arbre('tr-doc')+'<div class="panell">'+h+'</div></div></div>'+tasca()+'</div>';
}
function papereraWin(op){
 op=op||{};
 var vac;
 if(op.vacOk){vac='data-ok="1" id="vac-ic"'}
 else if(op.vacDbl){vac='data-ok2="1" data-dbl="1" id="vac-ic"'}
 else{vac='data-wrong="Aquesta sí que és la carpeta Vacances... però mira bé COM et demana fer el clic la instrucció."'}
 return '<div class="pant gris"><div class="exp">'
  +'<div class="tit-fin2">🗑️ Paperera de reciclatge</div>'
  +'<div class="exp-cap">'+ruta(['Aquest PC','Paperera'],null)+'</div>'
  +'<div class="exp-corp">'
  +'<div class="panell" data-wrong="Aquest és un lloc BUIT de la Paperera. La carpeta que busquem és la Vacances.">'
  +ptu('📂','Vacances',vac)

  +'</div></div></div>'+tasca()+'</div>';
}

/* ============ DESKTOP ============ */
function dsk(icons,okFons){
 return '<div class="pant"><div class="fons cwriter" '+(okFons?'data-ok="1"':'')+'>'
  +'<div class="geleria">'+icons.join('')+'</div></div>'+tasca()+'</div>';

/* ============ MOTOR ============ */
function trobaB(b){for(var i=0;i<BLOCS.length;i++){if(BLOCS[i].id===b)return BLOCS[i]}return null}
function escapa(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function fb(t,tip){
 var e=$('#fb'); if(!e)return;
 e.className='fb '+tip; e.textContent=t; e.style.display='block';
}
function neutre(m){fb('💬 '+m,'info')}
function fall(m){
 if(loked)return;
 errQ++; so('err');
 fb('❌ '+m,'err');
 var s=$('#esc');
 if(s){s.classList.add('sx');setTimeout(function(){s.classList.remove('sx')},480)}
 var b=$('#bAj'); if(b&&errQ>=2)b.classList.add('parp');
}
function avisa(t){BRVT.textContent=t;BRAVO.classList.add('on')}
function pistell(){
 var q=Llista[iQ]; if(!q||!q.ph)return;
 var t=$('#esc'); if(!t)return;
 var el=t.querySelector(q.ph); if(!el)return;
 el.classList.add('pist');
 setTimeout(function(){el.classList.remove('pist')},3400);
}
function avancar(){
 loked=true;
 var q=Llista[iQ];
 so('ok');
 var t=msgOk();
 avisa(t);
 resultats.push({b:q.b,primera:errQ===0});
 try{parla(t+' Has resolt la prova.')}catch(e){}
 setTimeout(function(){
  BRAVO.classList.remove('on');loked=false;iQ++;
  if(iQ<Llista.length)render();else final();
 },1500);
}
function troca(lnk,el){
 var n=el;
 while(n&&n!==lnk){
  if(n.dataset&&n.dataset.ok)return{ok:1,msg:n.dataset.wrong||''};
  if(n.dataset&&n.dataset.ok2)return{ok:1,msg:n.dataset.wrong||''};
  if(n.dataset&&n.dataset.wrong)return{wrong:1,msg:n.dataset.wrong};
  if(n.dataset&&n.dataset.drop)return{drop:1};
  n=n.parentElement;
 }
 return{};
}
function clicGen(lnk,e,dbl){
 var r=troca(lnk,e.target);
 if(r.ok)return true;
 if(r.wrong){fall(r.msg);return false}
 if(!dbl)neutre('Fes clic sobre l\'objecte que diu la instrucció (un botó, una icona, una tecla...).');
 return false;
}
function mostraMenu(){
 try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
 var n=Q.length;
 APP.innerHTML=
  '<h1>🎓 El joc de la informàtica bàsica</h1>'
  +'<p class="sub">Pràctica del <b>Manual bàsic d\'informàtica</b> (Windows 11 i Office) · <b>'+n+' proves</b> pas a pas</p>'
  +'<div class="tarja" style="text-align:center">'
  +'<p style="font-size:1.1rem;margin:.2em 0 .6em">Escolleix un tema per practicar o fes el recorregut complet.<br>Pots repetir cada prova tantes vegades com vulguis: aquí no hi ha presa ni rellotge. 🙂</p>'
  +'<button class="btn" id="btnTot">▶️ Jugar-ho tot ('+n+' proves)</button>'
  +'<button class="btn groc" id="btnFont" style="margin-left:10px">🔤 Lletra més gran</button>'
  +'</div>'
  +'<div class="marge-men">'+BLOCS.map(function(b){
    var nq=Q.filter(function(z){return z.b===b.id}).length;
    return '<button class="bloc" data-b="'+b.id+'"><span class="emo">'+b.emo+'</span><span>'+b.nom
      +'<small>'+b.des+'</small><span class="xifra">'+nq+' proves</span></span></button>';
  }).join('')+'</div>'
  +'<p class="peu">Per jugar: guarda aquest arxiu a l\'ordinador i fes DOBLE CLIC sobre ell per obrir-lo amb el navegador (Chrome o Edge). Funciona sense internet.<br>'
  +'Cada prova ensenya una cosa del manual · Amb botó de veu 🔊 i pistes 💡 · Sense rellotge, sense presses ✓</p>';
 $('#btnTot').onclick=function(){startGame(null)};
 $('#btnFont').onclick=function(){
  document.documentElement.classList.toggle('xx');
  this.textContent=document.documentElement.classList.contains('xx')?'🔤 Lletra normal':'🔤 Lletra més gran';
 };
 var bl=document.querySelectorAll('.bloc');
 for(var i=0;i<bl.length;i++){(function(b){b.onclick=function(){startGame(b.getAttribute('data-b'))}}(bl[i]))}
}
function startGame(b){
 Llista=b?Q.filter(function(z){return z.b===b}):Q.slice();
 resultats=[];iQ=0;
 render();
}
function render(){
 errQ=0;
 var q=Llista[iQ],bl=trobaB(q.b);
 var lbl=(bl?bl.nom:'Prova')+' — '+(q.tot||'');
 APP.innerHTML=sortida(lbl,Math.round(iQ/Llista.length*100))
  +'<div class="tarja"><div class="instr"><span class="n">'+(iQ+1)+'</span><div style="flex:1">'
  +'<p>'+escapa(q.txt)+'</p>'
  +'<div class="accions">'
  +'<button class="btn sec" id="bEscolta">🔊 Escolta</button>'
  +'<button class="btn groc" id="bAj">💡 Ajuda</button>'
  +'</div><div class="ajuda-txt" id="txtAj"></div></div></div>'
  +'<div id="fb" class="fb" style="display:none"></div>'
  +'<div class="escenari" id="esc"></div></div>';
 $('#bEscolta').onclick=function(){parla(q.txt+(q.aj?' Ajuda: '+q.aj:''))};
 $('#bAj').onclick=function(){
  var a=$('#txtAj');a.textContent='💡 '+q.aj;a.classList.add('visible');pistell();
 };
 $('#btnIni').onclick=mostraMenu;
 var esc=$('#esc');
 if(q.k==='type'){
  var hi=escapa(q.mostra).replace(/[^A-Za-z0-9 ]/g,function(m){return '<b>'+m+'</b>'});
  var chips='';
  if(q.chips){for(var i=0;i<q.chips.length;i++){chips+='<span>'+escapa(q.chips[i])+'</span>'}}
  esc.innerHTML='<div class="paper">'
   +(q.usu?'<div class="usu-chip"><span class="av">M</span><span>Maria</span></div><br>':'')
   +'<div class="bloq-txt" id="blq-t">'+hi+'</div>'
   +'<input id="in-txt" type="text" autocomplete="off" spellcheck="false" placeholder="Escriu aquí..." aria-label="text">'
   +'<div class="ets">'+chips+'</div>'
   +'<div style="margin-top:16px"><button class="btn" id="b-com">✔️ Comprova</button> '
   +'<button class="btn sec" id="b-del">🧹 Esborra</button></div>'
   +'</div>';
  var inp=$('#in-txt');
  setTimeout(function(){try{inp.focus()}catch(e){}},150);
  $('#b-com').onclick=function(){comprova(q,inp)};
  $('#b-del').onclick=function(){inp.value='';inp.focus()};
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')comprova(q,inp)});
 }else{
  esc.innerHTML=q.st();
  if(q.ph&&q.ph.indexOf('#id-k-')===0)
   ['#id-k-shift1','#id-k-shift2','#id-k-bloq','#id-k-back','#id-k-supr','#id-k-altgr','#id-k-intro','#id-k-accent'].forEach(function(s){
    if(s===q.ph||s==='#id-k-shift2'&&q.ph==='#id-k-shift1'){var k=esc.querySelector(s);if(k){k.setAttribute('data-ok','1');k.removeAttribute('data-wrong')}}
   });
  if(q.k==='click'){
   esc.addEventListener('click',function(e){e.preventDefault();if(!loked&&clicGen(esc,e,false))avancar()});
  }else if(q.k==='dblclick'){
   esc.addEventListener('click',function(e){
    e.preventDefault();
    var r=troca(esc,e.target);
    if(loked)return;
    if(r.ok)neutre('Molt a prop! Ara el SEGON clic, ràpid i a sobre de la mateixa icona.');
    else if(r.wrong)fall(r.msg);
    else neutre('Fes DOBLE CLIC (dos clics ràpids) sobre la icona indicada.');
   });
   esc.addEventListener('dblclick',function(e){e.preventDefault();if(!loked&&clicGen(esc,e,true))avancar()});
  }else if(q.k==='rclick'){
   esc.addEventListener('click',function(e){
    e.preventDefault();
    if(loked)return;
    var r=troca(esc,e.target);
    if(r.ok){neutre('Molt a prop! Això s\'obre amb el botó DRET del ratolí (el de la DRETA). Intent-ho!')}
    else if(r.wrong)fall(r.msg);
    else neutre('Fes CLIC DRET (el botó de la DRETA del ratolí) sobre l\'objecte correcte.');
   });
   esc.addEventListener('contextmenu',function(e){
    e.preventDefault();
    if(loked)return;
    var r=troca(esc,e.target);
    if(r.ok)avancar();
    else if(r.wrong)fall(r.msg);
    else neutre('Fes CLIC DRET (el botó de la DRETA del ratolí) sobre l\'objecte correcte.');
   });
  }else if(q.k==='drag'){
   muntaDrag(esc);
  }
 }
}
function comprova(q,inp){
 var v=inp.value,r=q.resp;
 var baixa=function(s){return s.toLocaleLowerCase('ca')};
 var nAcc=function(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')};
 var vr=v.trim(),rr=r;
 var eq=q.sens?(vr===rr):(baixa(vr)===baixa(rr));
 if(eq){avancar();return}
 if(vr===''){fall('El requadre està buit: escriu el text i prem Intro ↵.');inp.focus();return}
 if(!q.sens&&nAcc(baixa(vr))===nAcc(baixa(rr))){
  fall('Molt a prop! Falta l\'accent (o n\'hi ha un de mal posat). Recorda: PRIMER la tecla de l\'accent (´), DESPRÉS la vocal.');
  inp.select();return;
 }
 if(q.sens&&nAcc(baixa(vr))===nAcc(baixa(rr))){
  fall('Molt a prop! Han sortit bé, però cal MAJÚSCULES i minúscules exactes! Revisa BLOQ MAYÚS.');
  inp.select();return;
 }
 if(rr.indexOf('@')>=0&&vr.indexOf('@')<0){
  fall('Encara no hi ha cap @! Manté premut ALT GR i prem la tecla del número 2.');
  inp.focus();return;
 }
 if(rr.indexOf('!')>=0&&vr.indexOf('!')<0){
  fall('Encara falta el signe !: manté premut SHIFT i prem la tecla del número 1.');
  inp.focus();return;
 }
 fall('Encara no hi som: revisa el text lletra per lletra.');
 inp.focus();
}
function muntaDrag(esc){
 var clon=null,origen=null,x0=0,y0=0,mogut=false;
 esc.addEventListener('pointerdown',function(e){
  if(loked)return;
  var t=e.target.closest('[data-drag]');
  if(!t)return;
  origen=t;x0=e.clientX;y0=e.clientY;mogut=false;
  try{t.setPointerCapture(e.pointerId)}catch(err){}
  moventEvent=function(ev){
   if(!origen)return;
   if(!mogut&&Math.hypot(ev.clientX-x0,ev.clientY-y0)>6){
    mogut=true;origen.classList.add('agaf');
    var rect=origen.getBoundingClientRect();
    clon=origen.cloneNode(true);
    clon.className=clon.className.replace('clon','')+' clon';
    clon.style.width=rect.width+'px';clon.style.height=rect.height+'px';
    clon.style.left=ev.clientX+'px';clon.style.top=ev.clientY+'px';
    document.body.appendChild(clon);
   }
   if(mogut&&clon){
    clon.style.left=ev.clientX+'px';clon.style.top=ev.clientY+'px';
    var sota=document.elementFromPoint(ev.clientX,ev.clientY);
    var zona=sota&&sota.closest?sota.closest('[data-drop]'):null;
    var ant=document.querySelectorAll('.sobre-hi');
    for(var i=0;i<ant.length;i++)ant[i].classList.remove('sobre-hi');
    if(zona)zona.classList.add('sobre-hi');
   }
  };
  soltEvent=function(ev){
   if(!origen)return;
   origen.removeEventListener('pointermove',moventEvent);
   origen.removeEventListener('pointerup',soltEvent);
   if(clon){clon.remove();clon=null}
   var ant=document.querySelectorAll('.sobre-hi');
   for(var i=0;i<ant.length;i++)ant[i].classList.remove('sobre-hi');
   if(origen)origen.classList.remove('agaf');
   var sota=document.elementFromPoint(ev.clientX,ev.clientY);
   var zona=sota&&sota.closest?sota.closest('[data-drop]'):null;
   if(mogut){
    if(zona)avancar();
    else fall('Deixa\'l anar just a SOBRE la Paperera, amb el botó premut durant tot el camí!');
   }else{
    fall('Per arrossegar: manté PREMUT el botó esquerre mentre mous el ratolí, i deixa\'l anar al destí.');
   }
   origen=null;mogut=false;
  };
  origen.addEventListener('pointermove',moventEvent);
  origen.addEventListener('pointerup',soltEvent);
 });
}
function final(){
 var prim=0;
 for(var i=0;i<resultats.length;i++){if(resultats[i].primera)prim++}
 var tot=resultats.length;
 var est=prim/tot>=.9?3:(prim/tot>=.65?2:1);
 var msg=prim/tot>=.9?'Excel·lent! Ets una persona amb molta destresa digital.'
  :prim/tot>=.65?'Molt bé! Cada dia més còmode amb l\'ordinador.'
  :'Ho has aconseguit! Repetir és el camí del mestre.';
 var lista='';
 for(var j=0;j<BLOCS.length;j++){
  var qs=[];for(var k=0;k<resultats.length;k++){if(resultats[k].b===BLOCS[j].id)qs.push(resultats[k])}
  if(!qs.length)continue;
  var p=0;for(var m=0;m<qs.length;m++){if(qs[m].primera)p++}
  lista+='<div><span>'+BLOCS[j].emo+' '+BLOCS[j].nom+'</span><span>'+p+' de '+qs.length+' a la primera</span></div>';
 }
 APP.innerHTML=sortida('Final de la pràctica',100)
  +'<div class="tarja" style="text-align:center">'
  +'<div class="estres">'+'⭐'.repeat(est)+'<span style="opacity:.25">'+'⭐'.repeat(3-est)+'</span></div>'
  +'<div class="res-gran">🎉 Has acabat les '+tot+' proves!</div>'
  +'<p style="font-size:1.1rem">Respostes a la primera: <b>'+prim+' de '+tot+'</b></p>'
  +'<p style="font-size:1.05rem;font-weight:600;color:#28518f">'+msg+'</p>'
  +'<div class="llista-blocs">'+lista+'</div>'
  +'<div style="margin-top:18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'
  +'<button class="btn" id="f_txek">🔁 Torna-ho tot a provar</button>'
  +'<button class="btn sec" id="f_inici">☰ Torna al menú</button>'
  +'</div></div>';
 $('#f_txek').onclick=function(){startGame(null)};
 $('#f_inici').onclick=mostraMenu;
 parla('Enhorabona! Has acabat totes les proves. Has resolt '+prim+' de '+tot+' a la primera. '+msg);
}
try{if(window.speechSynthesis)speechSynthesis.getVoices()}catch(e){}
mostraMenu();
</script>
